# Builds the Android app (android/) with the newest Elite-Chess.html inside and publishes it as EliteChess.apk
# (plus EliteChess-<version>.apk). Runs when android/ changes, or by hand from the Actions tab.
# Signing key and certificate come from the ANDROID_SIGNING_KEY / ANDROID_SIGNING_CERT secrets (see android/build.sh).
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-update
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build the single-file app
        run: python3 tools/bundle.py Elite-Chess.html app-version.json
      - name: Build and sign the APK
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_CERT: ${{ secrets.ANDROID_SIGNING_CERT }}
        run: |
          read -r code name < android/version
          android/build.sh "EliteChess-$name.apk"
          cp "EliteChess-$name.apk" EliteChess.apk
      - name: Publish it
        run: |
          read -r code name < android/version
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add EliteChess.apk "EliteChess-$name.apk" Elite-Chess.html app-version.json
          git diff --cached --quiet && exit 0
          git commit -m "Android app $name"
          git pull --rebase
          git push
