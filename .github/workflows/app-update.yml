# Rebuilds Elite-Chess.html (the whole app in one file) and app-version.json whenever the site changes,
# including files uploaded through github.com. The Android app checks app-version.json and downloads new versions.
name: Android app update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-update
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-file app
        run: python3 tools/bundle.py Elite-Chess.html app-version.json
      - name: Publish it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Elite-Chess.html app-version.json
          git diff --cached --quiet && exit 0
          git commit -m "Android app update $(python3 -c 'import json;print(json.load(open("app-version.json"))["build"])')"
          git pull --rebase
          git push
