# Refreshes sports/motogp.json (MotoGP schedule and results for the app's Sport screen): every 15 minutes from
# Thursday to Sunday (race weekends), once a day otherwise. It only commits when something changed.
name: Sports data
on:
  schedule:
    - cron: '*/15 * * * 4,5,6,0'
    - cron: '17 5 * * 1,2,3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sports-data
  cancel-in-progress: false
jobs:
  motogp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch MotoGP
        run: python3 tools/motogp.py sports/motogp.json
      - name: Publish it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sports/motogp.json
          git diff --cached --quiet && exit 0
          git commit -m "MotoGP data"
          git pull --rebase
          git push
