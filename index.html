<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Greenwood"><meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0c100e" media="(prefers-color-scheme: dark)"><meta name="description" content="Play bots, solve puzzles, win cups and learn chess, from your first move to grandmaster technique."><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><style>body{margin:0}img{max-width:100%}</style></head><body>
<meta charset="utf-8">
<title>Greenwood Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Greenwood Chess brand: forest green on calm neutrals, brass for trophies and highlights.
   Layout: a left rail (bottom tab bar on phones) and one screen at a time; play screens pair a board with a side panel. */
:root{
  --bg:#f5f5f2; --surface:#ffffff; --surface-2:#f1f1ed; --surface-3:#e6e6e0;
  --ink:#151917; --muted:#5d6560; --line:#e3e3dd; --line-deep:#d2d2ca;
  --accent:#1d6b51; --accent-deep:#155440; --accent-soft:#e5efe9; --accent-ink:#fff;
  --gold:#c4932f; --gold-deep:#93691b; --gold-ink:#fff;
  --good:#1f9467; --alarm:#d0443f; --alarm-ink:#fff; --warn:#c2861a;
  --shadow-sm:0 1px 2px rgba(17,24,20,.06);
  --shadow:0 1px 2px rgba(17,24,20,.05),0 2px 8px -2px rgba(17,24,20,.06);
  --shadow-lg:0 2px 4px rgba(17,24,20,.04),0 16px 40px -12px rgba(17,24,20,.22);
  --f-head:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --sq-l:#e9eedd; --sq-d:#5b8d7a; --board-bg:transparent;
  --hero:linear-gradient(135deg,#0f3326 0%,#17473a 55%,#1d5a49 100%);
  --nav-bg:rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c100e; --surface:#141917; --surface-2:#1a201d; --surface-3:#232a27;
    --ink:#e8ece9; --muted:#97a19b; --line:#222a26; --line-deep:#2e3732;
    --accent:#3f9f7b; --accent-deep:#2f8566; --accent-soft:#15302a;
    --gold:#d3a24a; --gold-deep:#b38431;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px -2px rgba(0,0,0,.4);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 44px -12px rgba(0,0,0,.7);
    --nav-bg:rgba(20,25,23,.88);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c100e; --surface:#141917; --surface-2:#1a201d; --surface-3:#232a27;
  --ink:#e8ece9; --muted:#97a19b; --line:#222a26; --line-deep:#2e3732;
  --accent:#3f9f7b; --accent-deep:#2f8566; --accent-soft:#15302a;
  --gold:#d3a24a; --gold-deep:#b38431;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px -2px rgba(0,0,0,.4);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 44px -12px rgba(0,0,0,.7);
  --nav-bg:rgba(20,25,23,.88);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;font-feature-settings:"cv11","ss01"}
button,input,textarea{font-family:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.02em;font-family:var(--f-head);font-weight:650}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.tag.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold-deep)}
.rating-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.rating-chip b{font:700 15px var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.rating-chip.big b{font-size:17px}
.rating-chip i{font-style:normal;font-weight:700;font-size:12px}
.up{color:var(--good)} .down{color:var(--alarm)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font:700 17px var(--f-head);letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:32px;height:32px;flex:none}
.logo span{color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;text-align:left;color:var(--muted);transition:background .12s,color .12s}
.nav svg{width:20px;height:20px;flex:none;stroke-width:1.75}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav.mobile-only{display:none}
.rail .spacer{flex:1}
main{min-width:0;padding:28px 32px 48px}
.screen{max-width:1240px;margin:0 auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:40;flex-direction:row;justify-content:space-around;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:2px;overflow:visible;background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
  .logo,.rail .spacer,.nav.desk-only{display:none}
  .nav.mobile-only{display:flex}
  .nav{flex-direction:column;gap:3px;font-size:10.5px;font-weight:600;padding:7px 4px 5px;text-align:center;flex:1;border-radius:8px}
  .nav svg{width:22px;height:22px}
  .nav[aria-current="page"]{background:transparent;color:var(--accent)}
  main{padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-deep);border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;line-height:1.3;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
.btn.pop{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.pop:hover{background:var(--accent-deep)}
.btn.violet{background:var(--ink);border-color:transparent;color:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.violet:hover{background:color-mix(in srgb,var(--ink) 86%,var(--surface))}
.btn.big{width:100%;padding:13px 20px;font:600 16px var(--f-head);border-radius:12px;letter-spacing:-.01em}
.btn.big-row{width:100%;padding:13px 14px;font-size:15px;justify-content:flex-start}
.btn.danger{background:var(--alarm);border-color:transparent;color:var(--alarm-ink)}
.btn.danger:hover{background:color-mix(in srgb,var(--alarm) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);padding:7px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
button:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 11px;background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.chip-btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.chips,.theme-chips{display:flex;flex-wrap:wrap;gap:8px}
.search,.textbox{width:100%;border:1px solid var(--line-deep);background:var(--surface);border-radius:10px;padding:10px 13px;font-size:15px;transition:border-color .12s,box-shadow .12s}
.search:focus,.textbox:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.textbox{font:13px/1.45 var(--f-mono);resize:vertical}

/* ---------- Common layout ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.board-col{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:720px;width:100%;margin-inline:auto}
.panel{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:19px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.025em}
.page-head h2{font-size:22px}
.page-head p{margin:4px 0 0}
@media (max-width:1080px){ .play{grid-template-columns:1fr} .board-col{max-width:640px} }

/* ---------- Player bars ---------- */
.player{display:flex;align-items:center;gap:10px;padding:2px 0;min-height:44px}
.av{border-radius:10px;overflow:hidden;flex:none}
.av svg{width:100%;height:100%;display:block}
.player .av{width:38px;height:38px;border-radius:8px}
.pinfo{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.pname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname .elo{font-weight:500;color:var(--muted);margin-left:6px;font-size:13px;font-variant-numeric:tabular-nums}
.caps{display:flex;align-items:center;min-height:18px}
.cap{display:inline-block;width:18px;height:18px;margin-right:-7px;background:center/100% 100% no-repeat}
.cap.gap{margin-left:7px}
.adv{font:600 12px var(--f-mono);color:var(--muted);margin-left:12px}
.player .spacer{flex:1}
.think{font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.think::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.clock{flex:none;font:600 20px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:9px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);min-width:5.2em;text-align:right}
.clock.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.clock.low{background:var(--alarm);border-color:var(--alarm);color:var(--alarm-ink)}

/* ---------- Board ---------- */
.board-host{position:relative;width:100%}
.frame{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 32px -14px rgba(10,30,20,.45);background:var(--board-bg)}
[data-glass] .frame{box-shadow:0 14px 36px -14px rgba(20,40,60,.55),inset 0 0 0 1px rgba(255,255,255,.35)}
[data-glass] .frame::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%)}
[data-glass] .sq.l{box-shadow:inset 0 0 0 .2cqi rgba(255,255,255,.25)}
[data-glass] .coord{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.hl{position:absolute;inset:0;pointer-events:none}
.hl.last{background:rgba(255,210,70,.42)}
.hl.sel{background:rgba(255,210,70,.58)}
.hl.mark{background:rgba(226,82,62,.72)}
.hl.chk{background:radial-gradient(circle,rgba(230,30,20,.95) 0%,rgba(230,30,20,.55) 40%,rgba(230,30,20,0) 72%)}
.hl.good{background:rgba(31,148,103,.55)}
.hl.bad{background:rgba(208,68,63,.55)}
.hl.hint{box-shadow:inset 0 0 0 .8cqi rgba(29,107,81,.95);animation:hint 1.1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:inset 0 0 0 .3cqi rgba(29,107,81,.4)}}
.piece{position:absolute;inset:0;z-index:2;background:center/100% 100% no-repeat;pointer-events:none;filter:drop-shadow(0 .25cqi .2cqi rgba(0,0,0,.22))}
.piece.moving{z-index:6}
.dot{position:absolute;z-index:3;left:50%;top:50%;width:3.3cqi;height:3.3cqi;margin:-1.65cqi 0 0 -1.65cqi;border-radius:50%;background:rgba(10,20,15,.22);pointer-events:none}
.ring{position:absolute;z-index:3;inset:0;border-radius:50%;box-shadow:inset 0 0 0 .9cqi rgba(10,20,15,.22);pointer-events:none}
.sq.hover::after{content:"";position:absolute;inset:0;z-index:4;box-shadow:inset 0 0 0 .55cqi rgba(255,255,255,.8);pointer-events:none}
.coord{position:absolute;z-index:3;font:600 1.7cqi/1 var(--f-body);pointer-events:none}
.sq.l .coord{color:var(--sq-d)}.sq.d .coord{color:var(--sq-l)}
.coord.rk{top:.55cqi;left:.7cqi}.coord.fl{bottom:.5cqi;right:.8cqi}
.badge{position:absolute;z-index:7;top:-1.2cqi;right:-1.2cqi;width:4.4cqi;height:4.4cqi;pointer-events:none;filter:drop-shadow(0 .2cqi .3cqi rgba(0,0,0,.35))}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);background:center/100% 100% no-repeat;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.promo{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,14,11,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.promo-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:6px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.promo-card button{position:relative;width:12cqi;height:12cqi;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.promo-card button:hover{background:var(--accent-soft);border-color:var(--accent)}
@keyframes pop{from{transform:scale(.97) translateY(4px);opacity:0}}
.board-with-bar{display:flex;gap:10px;align-items:stretch}
.evalbar{position:relative;width:22px;flex:none;border-radius:4px;overflow:hidden;background:#2a2f2d}
.evalbar .fill{position:absolute;left:0;right:0;bottom:0;background:#f3f3f0;transition:height .35s ease}
.evalbar .num{position:absolute;left:0;right:0;font:600 10px/1 var(--f-mono);text-align:center;padding:4px 0}
.evalbar .num.top{top:0}.evalbar .num.bot{bottom:0}
.board-with-bar .board-host{flex:1;min-width:0}
.mini{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--board-bg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mini i{position:relative;display:block}
.mini i.l{background:var(--sq-l)}.mini i.d{background:var(--sq-d)}
.mini b{position:absolute;inset:0;background:center/100% 100% no-repeat}

/* ---------- Setup ---------- */
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 8px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);transition:background .12s,color .12s}
.tabs button:hover{color:var(--ink)}
.tabs.small button{padding:6px 4px;font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.bot-hero{display:flex;gap:14px;align-items:flex-start}
.bot-hero .av{width:80px;height:80px;border-radius:14px}
.bot-hero h3{font-size:19px;font-weight:650}
.bot-hero .elo{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums}
.bubble{position:relative;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.bubble::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;border:0;padding:0;background:transparent;cursor:pointer;border-radius:12px;transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile .av{aspect-ratio:1;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.tile .r{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font:600 10px/1 var(--f-mono);background:var(--ink);color:var(--surface);padding:3px 5px;border-radius:5px;white-space:nowrap}
.tile[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sides{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.side{border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px;color:var(--muted);transition:background .12s,border-color .12s}
.side:hover{background:var(--surface-2)}
.side .pc{width:32px;height:32px;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.pc-pair{display:flex;height:32px;align-items:center}
.pc-pair i{width:24px;height:24px;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.pc-pair i + i{margin-left:-8px}
.side[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s}
.tc:hover{background:var(--surface-2)}
.tc small{display:block;font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tc[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.engine-note{font-size:13px;color:var(--muted)}
.ol-code{min-width:0;padding:11px 14px;border:1px solid var(--line-deep);border-radius:10px;background:var(--surface);font:600 18px var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.ol-code:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.ol-status{font-size:14px;color:var(--muted);text-align:center}.ol-status:empty{display:none}.ol-status.warn{color:var(--alarm)}
.ol-big{font:600 40px var(--f-mono);letter-spacing:.18em;color:var(--ink);margin:4px 0}
.engine-note.warn{color:var(--alarm)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch.compact{font-size:13px;gap:8px}
.switch button{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--surface-3);cursor:pointer;flex:none;transition:background .15s}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch button[aria-pressed="true"]{background:var(--accent)}
.switch button[aria-pressed="true"]::after{transform:translateX(18px)}

/* ---------- Game ---------- */
.game-head{display:flex;align-items:center;gap:12px}
.game-head .av{width:44px;height:44px;border-radius:10px}
.status{font:650 19px/1.25 var(--f-head);letter-spacing:-.015em}
.status-sub{font-size:13px;color:var(--muted)}
.opening-name{font-size:13px;font-weight:600;color:var(--accent);min-height:1em}
.moves{list-style:none;margin:0;padding:4px 0;max-height:300px;overflow-y:auto;font:500 14px/1 var(--f-body);border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.moves li{display:grid;grid-template-columns:2.8em 1fr 1fr;align-items:center;padding:0 6px}
.moves li:nth-child(even){background:color-mix(in srgb,var(--surface-3) 45%,transparent)}
.moves .n{color:var(--muted);font-size:12.5px;padding:8px 0 8px 4px;font-variant-numeric:tabular-nums}
.mv{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-weight:600;border:0;background:transparent;text-align:left;font-size:14px}
button.mv{cursor:pointer}
button.mv:hover{background:var(--surface)}
.mv.cur{background:var(--accent);color:var(--accent-ink)}
.moves .empty{display:block;color:var(--muted);padding:12px 14px}
.moves .res{display:block;text-align:center;font-weight:700;padding:10px}
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.controls .btn{flex-direction:column;gap:4px;padding:10px 4px 8px;font-size:12px;font-weight:600}

/* ---------- Modals, toasts ---------- */
.modal-back{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,10,8,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-lg);animation:pop .2s ease-out;display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(560px,100%)}
.modal h2{font-size:22px;font-weight:700;text-align:center}
.modal .sub{text-align:center;color:var(--muted);margin-top:-8px}
.vs{display:flex;align-items:center;justify-content:center;gap:18px}
.vs .who{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;max-width:120px;text-align:center}
.vs .av{width:68px;height:68px;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.vs .who.win .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.vs .score{font:700 26px var(--f-head);font-variant-numeric:tabular-nums}
.rating-change{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.rating-change b{font:700 22px var(--f-head);font-variant-numeric:tabular-nums}
.rating-change i{font-style:normal;font-weight:700;padding:2px 8px;border-radius:6px}
.rating-change.up i{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.rating-change.down i{background:color-mix(in srgb,var(--alarm) 15%,transparent);color:var(--alarm)}
.cup-msg{text-align:center;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-radius:10px;padding:10px}
.big-num{font:700 60px/1 var(--f-head);text-align:center;color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow-lg);font-size:14px;animation:pop .22s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(8px)}
@media (max-width:900px){ #toasts{bottom:88px;left:16px;right:16px;max-width:none} }
.celebrate{position:relative;display:flex;flex-direction:column;gap:14px;align-items:center;overflow:hidden}
.big-trophy{width:104px;height:104px;font-size:80px;line-height:104px;text-align:center;animation:pop .4s ease-out}
.big-trophy svg{width:100%;height:100%}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;animation:fall 2.4s ease-in infinite}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.2}}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.theme{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.theme .sw{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 0 0 1px var(--line)}
.theme[aria-pressed="true"]{color:var(--ink)}
.theme[aria-pressed="true"] .sw{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}

/* ---------- Home ---------- */
.home{display:flex;flex-direction:column;gap:24px}
.hero{display:grid;grid-template-columns:1.3fr 1fr auto;gap:28px;align-items:center;background:var(--hero);color:#fff;border-radius:16px;padding:28px 30px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 18px 40px -22px rgba(10,40,28,.7);position:relative;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;z-index:-1;right:-40px;top:-40px;width:300px;height:300px;opacity:.06;transform:rotate(12deg);
  background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/60px 60px;-webkit-mask:radial-gradient(circle at 70% 30%,#000 30%,transparent 72%);mask:radial-gradient(circle at 70% 30%,#000 30%,transparent 72%)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
.hero .muted{color:rgba(255,255,255,.72);font-size:14px}
.hero-me{display:flex;gap:18px;align-items:center}
.av.big{width:80px;height:80px;border-radius:16px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff}
.hero .rating-chip{background:#fff;border-color:transparent;color:#4a524d}
.hero .rating-chip b{color:#151917}
.hero-chart{color:rgba(255,255,255,.9)}
.hero-chart .chart{width:100%;height:96px;color:inherit}
.hero-chart .chart path:last-child{stroke:#fff}
.hero-cta{display:flex;flex-direction:column;gap:10px;min-width:220px;position:relative;z-index:1}
.hero .btn.pop{background:#fff;color:#123b2e;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.hero .btn.pop:hover{background:#eef3f0}
.hero .btn.violet{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hero .btn.violet:hover{background:rgba(255,255,255,.16)}
.chart{width:100%;height:140px;display:block;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile-card{text-align:left;cursor:pointer;background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--line);display:flex;gap:14px;align-items:center;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.tile-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.tile-card h3{font-size:16px;font-weight:650;margin-top:2px}
.tile-card p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.tile-ico{width:48px;height:48px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);background:var(--accent-soft)}
.tile-ico svg{width:24px;height:24px}
.tile-ico svg[viewBox="0 0 64 64"]{width:30px;height:30px}
.mini-wrap{width:64px;flex:none}
.bot-strip h2{font-size:19px}
.bot-strip .strip{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 6px}
.strip-bot{flex:none;width:104px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:var(--shadow-sm);font-size:14px;transition:border-color .15s,transform .15s}
.strip-bot:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));transform:translateY(-1px)}
.strip-bot b{font-weight:600}
.strip-bot .av{width:64px;height:64px;border-radius:12px}
.strip-bot span{font:500 12px var(--f-mono);color:var(--muted)}
@media (max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr)} .hero{grid-template-columns:1fr} .hero-cta{min-width:0} }
@media (max-width:560px){ .tiles{grid-template-columns:1fr} .hero{padding:22px} .hero h1{font-size:25px} .hero-chart:has(text){display:none} }

/* ---------- Cups ---------- */
.cup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cup-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.cup-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--cup)}
.cup-top{display:flex;gap:14px}
.cup-top .trophy{width:64px;height:64px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.cup-top h3{font-size:18px;font-weight:650}
.cup-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;font-weight:600}
.cup-meta span{background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.cup-meta .warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:transparent;color:var(--gold-deep)}
.cup-status{font-weight:650;color:var(--accent)}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.match{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.slot{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:5px;min-width:0}
.slot .av{width:20px;height:20px;border-radius:4px}
.slot .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.slot .el{font:500 10px var(--f-mono);color:var(--muted)}
.slot.you{background:var(--accent-soft)}
.slot.won{box-shadow:inset 2px 0 0 var(--good)}
.slot.lost{opacity:.45}
.slot.empty{color:var(--muted);justify-content:center}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.shelf-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.shelf-item .trophy{width:60px;height:60px}
.shelf-item.locked .trophy{opacity:.3;filter:grayscale(1)}

/* ---------- Puzzles ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-row.four{grid-template-columns:repeat(4,1fr)}
.stat-row.one{grid-template-columns:1fr}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font:700 21px/1.15 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.prompt{display:flex;align-items:center;gap:12px;font:650 18px var(--f-head);letter-spacing:-.015em}
.prompt .pc{width:40px;height:40px;background-position:center;background-size:100% 100%;background-repeat:no-repeat;flex:none}
.feedback{border-radius:10px;padding:11px 14px;font-weight:600;display:flex;align-items:center;gap:10px;border:1px solid transparent}
.feedback.ok{background:color-mix(in srgb,var(--good) 11%,var(--surface));border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.feedback.bad{background:color-mix(in srgb,var(--alarm) 10%,var(--surface));border-color:color-mix(in srgb,var(--alarm) 28%,transparent)}
.feedback.info{background:var(--surface-2);border-color:var(--line);font-weight:500}
.feedback .ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-weight:700;font-size:13px}
.feedback.ok .ic{background:var(--good)}.feedback.bad .ic{background:var(--alarm)}
.pz-top{min-height:4px}
.rush-bar{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow-sm)}
.rush-score{font:700 24px var(--f-head);color:var(--accent);font-variant-numeric:tabular-nums}
.rush-strikes{font-weight:700;letter-spacing:4px;color:var(--alarm);flex:1}
.rush-time{font:600 21px var(--f-mono);font-variant-numeric:tabular-nums}
.rush-intro{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.rush-ico{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft)}
.rush-ico svg{width:32px;height:32px}

/* ---------- Learn ---------- */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.course-card{text-align:left;cursor:pointer;background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.course-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.course-card.kids{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 7%,var(--surface)),var(--surface) 60%)}
.cc-top{display:flex;justify-content:space-between;align-items:center}
.cc-top .pill{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.cc-ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.cc-ico .pc{width:36px;height:36px;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.course-card h3{font-size:17px;font-weight:650}
.course-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar div{height:100%;background:var(--accent);border-radius:99px}
.lesson-list{display:flex;flex-direction:column;gap:8px;max-width:760px}
.lesson-row{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s}
.lesson-row:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.lesson-row .num{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:650 14px var(--f-head);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
.lesson-row .grow{display:flex;flex-direction:column}
.lesson-row .bar{width:90px}
.lesson-list.kids .lesson-row{font-size:17px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.book{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm)}
.book .spine{width:10px;flex:none;border-radius:3px 6px 6px 3px;background:linear-gradient(180deg,hsl(var(--h) 38% 48%),hsl(var(--h) 38% 34%))}
.book h3{font-size:16px;font-weight:650}
.book ul{margin:8px 0;padding-left:18px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.dots i.done{background:var(--accent)}
.dots i.cur{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.coach{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.coach .av{width:48px;height:48px;border-radius:10px}
.coach h3{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.coach p{margin:4px 0 0;font-size:15px}
.coach .ev{font:600 12px var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink);margin-left:auto}
.small-coach p{font-size:15.5px;line-height:1.6}
.kids-mode .small-coach p{font-size:19px}
.kids-mode .panel h2{font-size:26px}
.quiz{display:flex;flex-direction:column;gap:8px}
.quiz-opt{text-align:left;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line-deep);font-weight:600;font-size:15px;cursor:pointer;transition:background .12s,border-color .12s}
.quiz-opt:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.quiz-opt.right{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.quiz-opt.wrong{background:color-mix(in srgb,var(--alarm) 12%,var(--surface));border-color:color-mix(in srgb,var(--alarm) 50%,transparent);opacity:.85}
.drill-bar{display:flex;justify-content:space-between;font-weight:650;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.credit{font-size:11.5px;color:var(--muted);margin:32px auto 0;text-align:center;max-width:780px;line-height:1.6;opacity:.85}
.credit a{color:inherit;text-underline-offset:2px}

/* ---------- Openings & analysis ---------- */
.op-list{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow-y:auto}
.op-item{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:14px;transition:background .12s,border-color .12s}
.op-item:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.op-item .san{font:600 14px var(--f-mono);min-width:3.4em}
.eco{font:600 11px var(--f-mono);background:var(--accent);color:#fff;border-radius:5px;padding:2px 6px}
.op-name{font:650 17px var(--f-head);display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.015em}
.op-moves{font:500 14px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
.guide-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);transition:background .12s,border-color .12s}
.guide b{color:var(--ink);font-size:14px;font-weight:600}
.guide:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.engine-lines{display:flex;flex-direction:column;gap:6px;min-height:96px}
.eline{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);text-align:left;background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;width:100%}
.eline:hover{background:var(--accent-soft)}
.eline .ev{font:600 13px var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px;min-width:4em;text-align:center}
.eline .ev.top{background:var(--accent);border-color:var(--accent);color:#fff}
.eline .pv{font-family:var(--f-mono)}
.navbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---------- Review ---------- */
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress div{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc .card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.acc .av{width:38px;height:38px;border-radius:8px}
.acc .num{font:700 24px/1 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.acc small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.cls{width:100%;border-collapse:collapse;font-size:14px}
.cls td{padding:5px 2px;border-bottom:1px solid var(--line)}
.cls tr:last-child td{border-bottom:0}
.cls td.c{text-align:center;font-weight:650;width:3em;font-variant-numeric:tabular-nums}
.cls .lab{display:flex;align-items:center;gap:8px;font-weight:500}
.ci{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 11px/1 var(--f-head);flex:none;letter-spacing:-.04em}
.graph{width:100%;height:96px;border-radius:8px;overflow:hidden;background:#2a2f2d;cursor:pointer;display:block}

/* ---------- Profile ---------- */
.profile-grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.me-card{display:flex;gap:16px;align-items:center}
.av.huge{width:104px;height:104px;border-radius:20px;box-shadow:0 0 0 1px var(--line)}
.name-in{font:650 19px var(--f-head);letter-spacing:-.015em}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts button{border:1px solid var(--line);cursor:pointer;border-radius:8px}
.parts button.sw{width:30px;height:30px;background:var(--sw);border-color:rgba(0,0,0,.08)}
.parts button.txt{padding:5px 10px;background:var(--surface);font-size:12px;font-weight:600;text-transform:capitalize}
.parts button.txt:hover{background:var(--surface-2)}
.parts button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;opacity:.55;filter:grayscale(.85)}
.ach.got{opacity:1;filter:none;background:color-mix(in srgb,var(--gold) 9%,var(--surface));border-color:color-mix(in srgb,var(--gold) 28%,var(--line))}
.ach div{display:flex;flex-direction:column}
.ach-ico{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
@media (max-width:1000px){ .profile-grid{grid-template-columns:1fr} }

/* ---------- Onboarding ---------- */
.onboard{display:flex;flex-direction:column;gap:14px}
.ob-logo{display:flex;justify-content:center}
.ob-logo svg{width:56px;height:56px}
.ob-looks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ob-looks button{border:0;padding:0;background:transparent;cursor:pointer;border-radius:12px}
.ob-looks .av{aspect-ratio:1;width:100%;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.ob-looks button[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ob-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ob-levels button{border:1px solid var(--line);border-radius:10px;padding:10px 4px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:12px;transition:background .12s,border-color .12s}
.ob-levels button:hover{background:var(--surface-2)}
.ob-levels b{font-weight:600}
.ob-levels span{font:500 11px var(--f-mono);color:var(--muted)}
.ob-levels button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:520px){
  .bot-grid{gap:6px}
  .clock{font-size:17px;padding:8px 10px}
  .panel{padding:16px}
  .page-head h1{font-size:24px}
  .ob-levels{grid-template-columns:repeat(3,1fr)}
  .themes{grid-template-columns:repeat(4,1fr)}
  .guide-list{grid-template-columns:1fr}
  .cup-grid{grid-template-columns:1fr}
  .stat-row.four{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){ #scr-setup .board-col{display:none} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
